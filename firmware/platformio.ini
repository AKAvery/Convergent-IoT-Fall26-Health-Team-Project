; One code base for all 4 sound boxes (Seeed XIAO ESP32-S3 + INMP441).
; Each environment builds a different program from its own folder in src/.
;
;   pio run -e board_check -t upload   ; blink + print chip info (no mic needed)
;   pio run -e ble_fake    -t upload   ; BLE peripheral with fake `level` data
;   pio run -e loudness    -t upload   ; INMP441 peak dBFS every 100 ms (needs the mic)
;
; See README.md for the full how-to.

[platformio]
default_envs = board_check

; ---------------------------------------------------------------------------
; Which box is this? Change this ONE line before flashing each box:
; FRONT, BACK, LEFT or RIGHT. It sets the BLE name SoundBox-<POSITION>.
; ---------------------------------------------------------------------------
[box]
position = FRONT

[env]
platform = platformio/espressif32 @ 7.1.3   ; Arduino-ESP32 2.0.17 (ESP-IDF 4.4)
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200                       ; ignored by native USB CDC, kept for tools
monitor_filters = esp32_exception_decoder
build_flags =
    -DBOX_POS_${box.position}
build_src_flags =                            ; warnings for our code only, not the libraries
    -Wall
    -Wextra

[env:board_check]
build_src_filter = +<board_check/>

[env:ble_fake]
build_src_filter = +<ble_fake/>
lib_deps =
    h2zero/NimBLE-Arduino @ 2.5.1

[env:loudness]
build_src_filter = +<loudness/>
