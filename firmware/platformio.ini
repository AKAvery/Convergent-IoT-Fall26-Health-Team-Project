; One code base for all 4 sound boxes (Seeed XIAO ESP32-C3 + INMP441; the S3 still builds).
; Each environment builds a different program from its own folder in src/.
;
;   pio run -e board_check -t upload   ; blink + print chip info (no mic needed)
;   pio run -e ble_fake    -t upload   ; BLE peripheral with fake `level` data
;   pio run -e loudness    -t upload   ; INMP441 peak dBFS every 100 ms (needs the mic)
;   pio run -e box         -t upload   ; the real box: mic level + ADPCM audio over BLE (needs the mic)
;   pio run -e wifi_check  -t upload   ; Wi-Fi scan + join + internet check (needs include/wifi_secrets.h)
;   pio test -e native                 ; ADPCM tests on this computer, against fixtures/adpcm/
;
; See README.md for the full how-to.

[platformio]
default_envs = board_check

; ---------------------------------------------------------------------------
; Which box is this? Change this ONE line before flashing each box:
; FRONT, BACK, LEFT or RIGHT. It sets the BLE name SoundBox-<POSITION>.
; ---------------------------------------------------------------------------
[box]
position = FRONT
; Which board: seeed_xiao_esp32c3 (what we have) or seeed_xiao_esp32s3.
board = seeed_xiao_esp32c3

; Settings shared by every board build (each [env:...] below `extends` it).
[esp32]
platform = platformio/espressif32 @ 7.1.3   ; Arduino-ESP32 2.0.17 (ESP-IDF 4.4)
board = ${box.board}
framework = arduino
monitor_speed = 115200                       ; ignored by native USB CDC, kept for tools
monitor_filters = esp32_exception_decoder
build_flags =
    -DBOX_POS_${box.position}
build_src_flags =                            ; warnings for our code only, not the libraries
    -Wall
    -Wextra

[env:board_check]
extends = esp32
build_src_filter = +<board_check/>

[env:ble_fake]
extends = esp32
build_src_filter = +<ble_fake/>
lib_deps =
    h2zero/NimBLE-Arduino @ 2.5.1

[env:loudness]
extends = esp32
build_src_filter = +<loudness/>

[env:box]
extends = esp32
build_src_filter = +<box/>
lib_deps =
    h2zero/NimBLE-Arduino @ 2.5.1

[env:wifi_check]
extends = esp32
build_src_filter = +<wifi_check/>

; Runs the tests in test/ on this computer (no board): pio test -e native
[env:native]
platform = native
build_flags =
    -std=c++17
    -Wall
    -Wextra
