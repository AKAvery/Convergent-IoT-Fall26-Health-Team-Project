name: SoundRing
options:
  bundleIdPrefix: edu.utexas.convergent
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  SoundRingKit:
    path: Packages/SoundRingKit
targets:
  SoundRing:
    type: application
    platform: iOS
    sources: [SoundRing]
    dependencies:
      - package: SoundRingKit
        product: Models
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        PRODUCT_BUNDLE_IDENTIFIER: edu.utexas.convergent.soundring
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""   # no app icon in the designs yet
  # Watch app (design-refs/Watch_45mm.png). Shares SoundRing/Shared with the iPhone app.
  # Not embedded in the iPhone app yet: embedding makes Xcode require the watchOS runtime just to
  # run the iPhone app. Run it on its own with the SoundRingWatch scheme.
  SoundRingWatch:
    type: application
    platform: watchOS
    sources:
      - SoundRingWatch
      - SoundRing/Shared
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Halo
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: edu.utexas.convergent.soundring
        PRODUCT_BUNDLE_IDENTIFIER: edu.utexas.convergent.soundring.watchkitapp
        CODE_SIGN_STYLE: Automatic
