name: SoundRing
options:
  bundleIdPrefix: edu.utexas.convergent
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  SoundRingKit:
    path: Packages/SoundRingKit
targets:
  SoundRing:
    type: application
    platform: iOS
    sources: [SoundRing]
    dependencies:
      - package: SoundRingKit
        product: Models
      - package: SoundRingKit
        product: Input
      - package: SoundRingKit
        product: Detection
      - package: SoundRingKit
        product: Names
      - package: SoundRingKit
        product: Cloud
    info:
      path: SoundRing/Info.plist
      properties:
        # The 4 body boxes stream audio over BLE; keep receiving it with the screen locked.
        NSBluetoothAlwaysUsageDescription: Halo connects to your pins over Bluetooth to hear the sounds around you.
        UIBackgroundModes: [bluetooth-central]
        # Name alerts: Apple's on-device speech-to-text on the pins' audio (nothing leaves the phone).
        NSSpeechRecognitionUsageDescription: Halo listens for your name in what your pins hear, on this iPhone only.
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        PRODUCT_BUNDLE_IDENTIFIER: edu.utexas.convergent.soundring
        CODE_SIGN_STYLE: Automatic
        # The generated Info.plist takes CFBundleVersion from these; without them installing on a
        # device (or "My Mac (Designed for iPad)") fails with "does not contain CFBundleVersion".
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""   # no app icon in the designs yet
  # Watch app (design-refs/Watch_45mm.png). Shares SoundRing/Shared with the iPhone app.
  # Not embedded in the iPhone app yet: embedding makes Xcode require the watchOS runtime just to
  # run the iPhone app. Run it on its own with the SoundRingWatch scheme.
  SoundRingWatch:
    type: application
    platform: watchOS
    sources:
      - SoundRingWatch
      - SoundRing/Shared
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Halo
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: edu.utexas.convergent.soundring
        PRODUCT_BUNDLE_IDENTIFIER: edu.utexas.convergent.soundring.watchkitapp
        CODE_SIGN_STYLE: Automatic
